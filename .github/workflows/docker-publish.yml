# .github/workflows/docker-publish.yml

name: Build and Publish Docker Image to GHCR

on:
  push:
    branches:
      - 'next' # Korrekt für deinen 'next'-Branch
  release:
    types: [published]

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    # WICHTIG: Diese Berechtigungen sind nötig, damit der Workflow
    # das Image in die GitHub Registry deines Accounts hochladen darf.
    permissions:
      contents: read
      packages: write

    steps:
      - name: Code vom Repository herunterladen
        uses: actions/checkout@v4
        with:
          ref: 'next'

      - name: QEMU einrichten (für Multi-Arch-Builds)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten (moderner Docker-Builder)
        uses: docker/setup-buildx-action@v3

      # Meldet sich bei der GitHub Container Registry (ghcr.io) an.
      # Nutzt ein automatisches Token. Du musst keine Secrets anlegen!
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} # Dein GitHub-Benutzername
          password: ${{ secrets.GITHUB_TOKEN }} # Automatisches Token

      - name: Metadaten für das Docker-Image extrahieren (Tags, Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Das Image wird jetzt auf ghcr.io veröffentlicht.
          # `${{ github.repository }}` wird automatisch zu 'DeinName/aniworld-downloader'.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=schedule
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Docker-Image bauen und auf GHCR hochladen
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}